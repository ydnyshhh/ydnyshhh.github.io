baseURL: "https://ydnyshhh.github.io/"
languageCode: en-us
title: yadnyesh's blog
theme: PaperMod
enableInlineShortcodes: true

services:
  googleAnalytics:
    id: G-N0E5F7XN8Q


params:
  ShowReadingTime: true
  ShowToc: true
  TocOpen: true
  math: true  
  ShowBreadCrumbs: true
  homeInfoParams:
    Title: Hi There 👋🏻
    Content: >-
      I’m Yadnyesh, a ML researcher working on reinforcement learning, agentic systems and post-training. I’m particularly interested in how we build and evaluate increasingly capable agents: the environments they learn in, the feedback and supervision they receive, the failures that emerge over long horizons and the systems needed to study them reliably. My broader interests include continual learning, AI for science and recursive self-improvement.
  
  socialIcons:
    - name: x
      url: "https://x.com/novasarc01"

markup:
  goldmark:
    renderer:
      unsafe: true



outputs:
  home:
    - HTML
    - RSS
    - JSON



menu:
  main:
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    - identifier: readinglist
      name: Reading List
      url: /readinglist/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40