{{- $image := .Page.Resources.GetMatch (.Get "src") -}}
{{- if not $image -}}{{- errorf "Missing SWG image: %s" (.Get "src") -}}{{- end -}}
<p><img class="swg-image" src="{{ $image.RelPermalink }}" width="{{ $image.Width }}" height="{{ $image.Height }}" loading="lazy" decoding="async" alt="{{ .Get "caption" }}"></p>
